<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OrcaAI Chat</title>
  
  <!-- Иконка -->
  <link rel="icon" type="image/png" href="favicon-192.png">
  
  <!-- PWA манифест -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Цвет темы -->
  <meta name="theme-color" content="#0f172a">
  
  <!-- Для iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OrcaAI">
  <link rel="apple-touch-icon" href="favicon-192.png">
  
  <!-- Ключ из внешнего файла (не в репозитории) -->
  <script src="config.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0f172a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 90vh;
      background: #1e293b;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }

    .chat-header {
      background: #0f172a;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #38bdf8;
    }

    #newChatBtn {
      background: #334155;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 18px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #334155;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    /* Анимация печати с блюром */
    .message.bot span {
      opacity: 0;
      filter: blur(10px);
      transform: translateY(5px);
      display: inline-block;
      animation: letterFadeIn 0.4s forwards;
    }

    @keyframes letterFadeIn {
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    .chat-input {
      display: flex;
      padding: 10px 15px;
      background: #0f172a;
      border-top: 1px solid #334155;
      gap: 8px;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: none;
      background: #1e293b;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .chat-input input:focus {
      box-shadow: 0 0 0 2px #38bdf8;
    }

    .chat-input button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .chat-input button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <span class="logo">🐋 OrcaAI</span>
      <button id="newChatBtn">Новый чат</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Спроси что-нибудь..." autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script>
    /const API_KEY = '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';
    
    const MODEL_LIST = [
      "deepseek/deepseek-chat:free",
      "openrouter/free"
    ];
    
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    
    let conversationHistory = [
      {
        role: 'system',
        content: 'Ты — OrcaAI, дружелюбный AI-ассистент от OrcaAbyss 🐋. Никогда не говори про модели, API или OpenRouter. Если спрашивают кто ты — отвечай: "Я OrcaAI 🐋". Общайся дружелюбно, по-русски, коротко и по делу.'
      }
    ];
    
    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msgDiv;
    }
    
    function typeEffect(text, element, speed = 25) {
      element.innerHTML = "";
      let i = 0;

      function type() {
        if (i < text.length) {
          const span = document.createElement("span");
          
          if (text[i] === ' ') {
            span.innerHTML = '&nbsp;';
          } else {
            span.textContent = text[i];
          }
          
          span.style.animationDelay = (i * 0.02) + "s";
          element.appendChild(span);
          chatMessages.scrollTop = chatMessages.scrollHeight;
          
          i++;
          setTimeout(type, speed);
        }
      }

      type();
    }
    
    async function tryModels(messages) {
      for (const model of MODEL_LIST) {
        try {
          const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${API_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: model,
              messages: messages,
              temperature: 0.7,
              max_tokens: 2048
            })
          });
          
          const data = await response.json();
          
          if (data.choices && data.choices[0] && data.choices[0].message) {
            return data.choices[0].message.content;
          }
        } catch (error) {
          console.log('Ошибка с моделью', model);
        }
      }
      return null;
    }
    
    async function sendMessage() {
      const prompt = userInput.value.trim();
      if (!prompt) return;
      
      sendBtn.disabled = true;
      userInput.disabled = true;
      
      addMessage(prompt, 'user');
      userInput.value = '';
      conversationHistory.push({ role: 'user', content: prompt });
      
      const botMsg = document.createElement('div');
      botMsg.classList.add('message', 'bot');
      chatMessages.appendChild(botMsg);
      
      const reply = await tryModels(conversationHistory);
      
      if (reply) {
        typeEffect(reply, botMsg, 25);
        conversationHistory.push({ role: 'assistant', content: reply });
      } else {
        botMsg.textContent = '❌ Все модели легли. Попробуй позже.';
      }
      
      sendBtn.disabled = false;
      userInput.disabled = false;
      userInput.focus();
    }
    
    function resetChat() {
      conversationHistory = [
        {
          role: 'system',
          content: 'Ты — OrcaAI, дружелюбный AI-ассистент от OrcaAbyss 🐋.'
        }
      ];
      chatMessages.innerHTML = '';
      addMessage('🐋 Привет! Я OrcaAI. Задавай любой вопрос!', 'bot');
    }
    
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    newChatBtn.addEventListener('click', resetChat);
    
    resetChat();
  </script>
  
  <!-- PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ Готово к установке!'))
        .catch(() => console.log('❌ Ошибка'));
    }
  </script>
</body>
</html>
