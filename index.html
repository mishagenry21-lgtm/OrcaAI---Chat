<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrcaAI Elite</title>
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="theme-color" content="#00c3ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* Футуристичные настройки интерфейса под стиль Poco F7 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0b0d; /* Глубокий темный фон */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Главный контейнер */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Стильный текстовый логотип вместо картинки */
        .brand-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00c3ff, #a020f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(0, 195, 255, 0.3));
        }

        /* Окно вывода ответа (чат-зона) */
        .orca-response-box {
            width: 100%;
            min-height: 120px;
            max-height: 50vh;
            overflow-y: auto;
            background: rgba(20, 20, 25, 0.6);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
            font-size: 16px;
            line-height: 1.6;
            color: #e0e0e6;
            display: none; /* Скрыто, пока нет ответа */
        }

        /* Индикатор загрузки (неоновая линия), пока ИИ думает */
        .orca-loader {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00c3ff, #a020f0, #00c3ff);
            background-size: 200% 100%;
            border-radius: 2px;
            margin-bottom: 20px;
            display: none;
            animation: moveLoader 1.5s linear infinite;
        }

        @keyframes moveLoader {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Современное поле ввода */
        .orca-input-wrapper {
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
            background: rgba(25, 25, 30, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 6px 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Неоновое свечение при фокусе */
        .orca-input-wrapper:focus-within {
            border-color: #00c3ff;
            box-shadow: 0 0 25px rgba(0, 195, 255, 0.4), inset 0 0 8px rgba(0, 195, 255, 0.05);
        }

        #orca-user-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            padding: 12px 6px;
            font-family: inherit;
        }

        #orca-user-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        /* Кнопка отправки с градиентом */
        #orca-send-btn {
            background: linear-gradient(135deg, #a020f0, #00c3ff);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 195, 255, 0.2);
        }

        #orca-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 18px rgba(0, 195, 255, 0.5);
        }

        #orca-send-btn:active {
            transform: scale(0.95);
        }

        #orca-send-btn svg {
            transition: transform 0.2s ease;
        }

        #orca-send-btn:hover svg {
            transform: translate(2px, -2px);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <h1 class="brand-title">OrcaAI Engine</h1>

        <div class="orca-loader" id="orca-line-loader"></div>

        <div class="orca-response-box" id="orca-response"></div>

        <div class="orca-input-wrapper">
            <input type="text" id="orca-user-input" placeholder="Спроси у OrcaAI..." autocomplete="off">
            <button id="orca-send-btn">
                <svg viewBox="0 0 24 24" width="22" height="22">
                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>

    </div>

    <script>
        const sendButton = document.getElementById('orca-send-btn');
        const inputField = document.getElementById('orca-user-input');
        const responseBox = document.getElementById('orca-response');
        const lineLoader = document.getElementById('orca-line-loader');

        function handleOrcaRequest() {
            const queryText = inputField.value.trim();
            if (!queryText) return;

            // Включаем неоновую линию загрузки под названием
            lineLoader.style.display = 'block';
            sendButton.style.pointerEvents = 'none';
            sendButton.style.opacity = '0.5';

            // Настраиваем окно вывода
            responseBox.style.display = 'block';
            responseBox.innerHTML = '<i>OrcaAI обрабатывает поток данных...</i>';
            inputField.value = '';

            // Эмуляция ответа (замени на свой fetch к локальной нейросети/серверу)
            setTimeout(() => {
                responseBox.innerText = "Запрос обработан. Мобильное ядро модели Orca работает стабильно. Конфигурация PWA и манифеста обновлена успешно.";
                
                // Выключаем загрузку
                lineLoader.style.display = 'none';
                sendButton.style.pointerEvents = 'auto';
                sendButton.style.opacity = '1';
            }, 2000);
        }

        sendButton.addEventListener('click', handleOrcaRequest);
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleOrcaRequest();
        });
    </script>

</body>
</html>
