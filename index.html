<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaAI Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --text-color: #ffffff;
            --panel-bg: #1a1a1a;
            --icon-bg: #2a2a2a;
            --accent: #007bff;
            /* Градиент ромба */
            --diamond-grad: conic-gradient(from 0deg, #ff4545, #3dff71, #2261ff, #ff4545);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header { 
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 110; background: rgba(11, 11, 11, 0.7);
        }
        
        .logo { font-weight: bold; font-size: 18px; letter-spacing: 1px; }
        .header-actions { display: flex; align-items: center; gap: 10px; background: #1a1a1a; padding: 6px 12px; border-radius: 25px; border: 1px solid #333; }
        .header-btn { background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .menu-trigger { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px; }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 160px; }
        
        /* ЛОГОТИП НА ГЛАВНОМ ЭКРАНЕ */
        .welcome-screen { margin: auto; text-align: center; max-width: 280px; animation: blurFade 1s ease; }
        .orca-logo-diamond {
            width: 80px; height: 80px; margin: 0 auto 20px;
            background: var(--diamond-grad);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            filter: drop-shadow(0 0 15px rgba(0, 123, 255, 0.4));
            animation: diamondPulse 3s ease-in-out infinite;
        }
        @keyframes diamondPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 123, 255, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(61, 255, 113, 0.5)); }
        }
        .welcome-screen h1 { font-size: 22px; margin-bottom: 10px; }
        .welcome-screen p { opacity: 0.6; font-size: 16px; line-height: 1.4; }

        .message { max-width: 85%; line-height: 1.5; font-size: 16px; position: relative; }
        .blur-in { animation: blurFade 0.6s ease-out forwards; filter: blur(10px); opacity: 0; }
        @keyframes blurFade { to { filter: blur(0); opacity: 1; } }

        .user-msg { align-self: flex-end; background: #222; padding: 12px 16px; border-radius: 18px 18px 4px 18px; }
        .orca-msg { align-self: flex-start; display: flex; gap: 12px; width: 100%; align-items: flex-start; }
        
        /* НОВАЯ АВАТАРКА-РОМБ В ЧАТЕ */
        .avatar { 
            width: 28px; height: 28px; flex-shrink: 0;
            background: var(--diamond-grad);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            animation: rot 6s linear infinite;
        }
        @keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* АНИМАЦИЯ ДУМАНИЯ */
        .think-container { display: flex; align-items: center; gap: 12px; animation: blurFade 0.5s ease; }
        .think-loader { width: 35px; height: 35px; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .orca-emoji { font-size: 20px; position: absolute; z-index: 2; }
        .radar-arc { 
            width: 100%; height: 100%; border-radius: 50%; position: absolute;
            background: conic-gradient(from 180deg at 50% 50%, #007bff 0deg, #00c6ff 60deg, transparent 60deg, transparent 360deg);
            -webkit-mask: radial-gradient(circle, transparent 65%, black 66%);
            mask: radial-gradient(circle, transparent 65%, black 66%);
            animation: radarRotate 1s linear infinite;
        }
        @keyframes radarRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        pre { background: #000; padding: 15px; border-radius: 12px; overflow-x: auto; position: relative; border: 1px solid #333; margin: 10px 0; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #333; color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-size: 10px; cursor: pointer; }

        .input-panel { position: fixed; bottom: 0; width: 100%; background: var(--panel-bg); border-radius: 24px 24px 0 0; padding: 15px 15px 25px; display: flex; flex-direction: column; gap: 15px; z-index: 100; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        #user-input { width: 100%; background: none; border: none; color: white; font-size: 18px; padding: 5px; }

        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .group { display: flex; gap: 10px; align-items: center; }
        .btn-circle { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--icon-bg); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-mode { border-radius: 21px; padding: 0 12px; height: 42px; display: flex; align-items: center; gap: 5px; background: var(--icon-bg); border: none; color: white; cursor: pointer; }
        
        .action-btn { height: 42px; border-radius: 21px; border: none; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .voice-style { background: white; color: black; padding: 0 18px; gap: 8px; }
        .send-style { background: #007bff; color: white; width: 42px; font-size: 18px; }

        .pop-menu { display: none; position: absolute; background: #1a1a1a; border: 1px solid #333; border-radius: 15px; padding: 8px; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 220px; max-height: 300px; overflow-y: auto; }
        .pop-menu.active { display: block; animation: blurFade 0.3s ease; }
        .pop-item { width: 100%; padding: 12px; background: none; border: none; color: white; text-align: left; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 105; }
        .icon-svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeMenus()"></div>

<header>
    <div class="logo">OrcaAI</div>
    <div style="display: flex; gap: 10px; align-items: center;">
        <div class="header-actions">
            <button class="header-btn" onclick="vibrate(); openMenu('chats-menu', event)">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12,23A1,1 0 0,1 11,22V19H7A2,2 0 0,1 5,17V7A2,2 0 0,1 7,5H21A2,2 0 0,1 23,7V17A2,2 0 0,1 21,19H16.9L13.2,22.7C13,22.9 12.7,23 12.4,23H12M3,15H1V3A2,2 0 0,1 3,1H15V3H3V15Z"/></svg>
            </button>
            <div style="width:1px; height:18px; background:rgba(255,255,255,0.1);"></div>
            <button class="header-btn" onclick="newChat()">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15,14C12.33,14 7,15.33 7,18V20H23V18C23,15.33 17.67,14 15,14M15,12A4,4 0 0,0 19,8A4,4 0 0,0 15,4A4,4 0 0,0 11,8A4,4 0 0,0 15,12M5,13V10H2V8H5V5H7V8H10V10H7V13H5Z"/></svg>
            </button>
        </div>
        <button class="menu-trigger" onclick="vibrate(); openMenu('settings-menu', event)">⋮</button>
    </div>

    <div id="chats-menu" class="pop-menu" style="top: 65px; right: 60px;"><div id="chats-list"></div></div>
    <div id="settings-menu" class="pop-menu" style="top: 65px; right: 20px;">
        <div style="padding: 10px;">
            <input type="password" id="key-in" placeholder="API KEY" style="width:100%; background:#000; border:1px solid #444; color:white; padding:5px; border-radius:5px;" onchange="saveKey(this.value)">
        </div>
        <button class="pop-item" onclick="clearAllData()" style="color:red;">Удалить всё</button>
    </div>
</header>

<div id="chat-window"></div>

<div class="input-panel">
    <input type="text" id="user-input" placeholder="Задайте любой вопрос" oninput="updateUI()" onkeydown="if(event.key==='Enter') send()">
    
    <div class="controls-row">
        <div class="group">
            <button class="btn-circle" onclick="vibrate()"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z"/></svg></button>
            <button class="btn-mode" onclick="vibrate(); openMenu('mode-menu', event)">
                <svg class="icon-svg" viewBox="0 0 24 24" style="width:16px;"><path d="M7,2V13H10V22L17,10H13L17,2H7Z"/></svg>
                <span id="mode-label">∨</span>
            </button>
            <div id="mode-menu" class="pop-menu" style="bottom: 80px; left: 15px;">
                <button class="pop-item" onclick="setM('Fast')">Быстрые ответы</button>
                <button class="pop-item" onclick="setM('Deep')">Думающий (DeepSeek)</button>
            </div>
        </div>
        <div class="group">
            <button class="btn-circle" onclick="vibrate()"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z"/></svg></button>
            <div id="action-area">
                <button class="action-btn voice-style" onclick="vibrate(); startV()">Голосовой режим</button>
            </div>
        </div>
    </div>
</div>

<script>
    let key = localStorage.getItem('orca_key') || '';
    let mode = 'Fast';
    let history = JSON.parse(localStorage.getItem('orca_hist')) || [];
    let allChats = JSON.parse(localStorage.getItem('orca_all_chats')) || [];
    let currentChatId = localStorage.getItem('orca_current_id') || Date.now();

    window.onload = () => { 
        document.getElementById('key-in').value = key;
        render(); updateChatsList();
    };

    function vibrate() { if(navigator.vibrate) navigator.vibrate(10); }
    function openMenu(id, e) { e.stopPropagation(); closeMenus(); document.getElementById(id).classList.add('active'); document.getElementById('overlay').style.display = 'block'; }
    function closeMenus() { document.querySelectorAll('.pop-menu').forEach(m => m.classList.remove('active')); document.getElementById('overlay').style.display = 'none'; }
    function saveKey(v) { key = v.trim(); localStorage.setItem('orca_key', key); }
    function setM(m) { mode = m; closeMenus(); vibrate(); }

    function newChat() {
        vibrate(); if(history.length > 0) saveCurrentChat();
        history = []; currentChatId = Date.now();
        localStorage.setItem('orca_hist', '[]'); localStorage.setItem('orca_current_id', currentChatId);
        render(); closeMenus();
    }

    function saveCurrentChat() {
        if(history.length === 0) return;
        const chatData = { id: currentChatId, title: history[0].content.substring(0, 25) + '...', data: [...history] };
        const idx = allChats.findIndex(c => c.id == currentChatId);
        if(idx > -1) allChats[idx] = chatData; else allChats.unshift(chatData);
        localStorage.setItem('orca_all_chats', JSON.stringify(allChats));
        updateChatsList();
    }

    function updateChatsList() {
        const list = document.getElementById('chats-list');
        list.innerHTML = allChats.length ? '' : '<div style="padding:10px; opacity:0.5; font-size:12px;">Нет чатов</div>';
        allChats.forEach(c => {
            const b = document.createElement('button'); b.className = 'pop-item'; b.innerText = c.title;
            b.onclick = () => { saveCurrentChat(); history = c.data; currentChatId = c.id; render(); closeMenus(); };
            list.appendChild(b);
        });
    }

    function render() {
        const win = document.getElementById('chat-window'); win.innerHTML = '';
        if(history.length === 0) {
            win.innerHTML = `
                <div class="welcome-screen">
                    <div class="orca-logo-diamond"></div>
                    <h1>Привет, я Orca AI.</h1>
                    <p>Чем могу помочь тебе сегодня?</p>
                </div>`;
            return;
        }
        history.forEach(m => {
            if(m.role === 'user') win.innerHTML += `<div class="message user-msg">${m.content}</div>`;
            else addAiMsg(m.content, false);
        });
        win.scrollTo(0, win.scrollHeight);
    }

    function addAiMsg(content, animate) {
        const win = document.getElementById('chat-window');
        const msgDiv = document.createElement('div'); msgDiv.className = 'orca-msg';
        msgDiv.innerHTML = `<div class="avatar"></div><div class="message ${animate ? 'blur-in' : ''}">${marked.parse(content)}</div>`;
        win.appendChild(msgDiv);
        msgDiv.querySelectorAll('pre').forEach(pre => {
            const btn = document.createElement('button'); btn.className = 'copy-btn'; btn.innerText = 'COPY';
            btn.onclick = () => { navigator.clipboard.writeText(pre.innerText.replace('COPY','')); btn.innerText = 'DONE!'; vibrate(); setTimeout(() => btn.innerText = 'COPY', 2000); };
            pre.appendChild(btn);
        });
    }

    async function send() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if(!text || !key) return;

        vibrate(); history.push({role: 'user', content: text});
        input.value = ''; updateUI(); render();

        const win = document.getElementById('chat-window');
        const tempId = 'loader-' + Date.now();
        win.innerHTML += `
            <div class="orca-msg" id="${tempId}">
                <div class="think-container">
                    <div class="think-loader"><div class="radar-arc"></div><div class="orca-emoji">🫍</div></div>
                    <div class="message" style="opacity:0.5;">Думаю...</div>
                </div>
            </div>`;
        win.scrollTo(0, win.scrollHeight);

        try {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST", headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                body: JSON.stringify({ "model": mode === 'Fast' ? 'google/gemini-2.0-flash-lite-001' : 'deepseek/deepseek-r1', "messages": history })
            });
            const data = await res.json();
            let aiText = data.choices[0].message.content.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}]/gu, '');
            document.getElementById(tempId).remove();
            addAiMsg(aiText, true); history.push({role: 'assistant', content: aiText});
            saveCurrentChat(); win.scrollTo(0, win.scrollHeight);
        } catch (e) { if(document.getElementById(tempId)) document.getElementById(tempId).remove(); alert('Ошибка API'); }
    }

    function updateUI() {
        const val = document.getElementById('user-input').value.trim();
        const area = document.getElementById('action-area');
        area.innerHTML = val.length > 0 ? 
            `<button class="action-btn send-style" onclick="send()">➔</button>` : 
            `<button class="action-btn voice-style" onclick="vibrate(); startV()">Голосовой режим</button>`;
    }

    function clearAllData() { if(confirm('Удалить всё?')) { localStorage.clear(); location.reload(); } }
    function startV() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition; if(!Rec) return;
        const rec = new Rec(); rec.onresult = (e) => { document.getElementById('user-input').value = e.results[0][0].transcript; updateUI(); send(); };
        rec.start();
    }
</script>
</body>
  </html>
