            <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaAI Elite</title>
    <link rel="manifest" href="manifest.json?v=3">
    <meta name="theme-color" content="#00c3ff">

    <style>
        :root {
            --bg-main: #0b0b0d;
            --bg-sidebar: #111115;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.5);
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: #121216;
            --user-bubble: #1c1c24;
            --orca-text: #e2e2e9;
            --menu-bg: #181820;
        }

        [data-theme="blue"] {
            --bg-main: #0a1128;
            --bg-sidebar: #001f54;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --border-color: rgba(0, 119, 182, 0.2);
            --input-bg: #003566;
            --user-bubble: #000814;
            --orca-text: #e0f2fe;
            --menu-bg: #001d3d;
        }

        [data-theme="white"] {
            --bg-main: #f8f9fa;
            --bg-sidebar: #e9ecef;
            --text-main: #212529;
            --text-sub: rgba(33, 37, 41, 0.6);
            --border-color: rgba(0, 0, 0, 0.1);
            --input-bg: #ffffff;
            --user-bubble: #dee2e6;
            --orca-text: #212529;
            --menu-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Кнопки для мобилок */
        button, input, .action-btn {
            touch-action: manipulation;
        }

        /* САЙДБАР */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: fixed;
            top: 0; bottom: 0; left: -265px;
            z-index: 9999;
            transition: left 0.2s ease-out;
        }

        .sidebar.active {
            left: 0;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #a020f0, #00c3ff);
            color: #ffffff;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 13px;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9998;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* ОСНОВНОЙ ЭКРАН */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
            width: 100%;
        }

        .header-bar {
            height: 50px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .menu-toggle, .more-toggle {
            background: none;
            border: none;
            color: var(--text-main);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ВЫПАДАЮЩЕЕ МЕНЮ */
        .options-menu {
            position: absolute;
            top: 55px; right: 10px;
            background: var(--menu-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            width: 240px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 10000;
        }

        .options-menu.active {
            display: flex !important;
        }

        .options-menu h4 {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-sub);
        }

        .options-menu input {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .theme-selector {
            display: flex;
            gap: 6px;
        }

        .theme-btn {
            flex: 1;
            padding: 6px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            font-size: 11px;
        }

        /* СТАРТОВЫЙ ЭКРАН */
        .welcome-container {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
            z-index: 2;
        }

        .welcome-container.hidden {
            display: none !important;
        }

        .welcome-rhombus-wrapper {
            position: relative;
            width: 80px; height: 80px;
            margin-bottom: 10px;
        }

        .welcome-rhombus {
            width: 100%; height: 100%;
        }

        .orca-emoji {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }

        /* ОРБИТА */
        .orbit-dot {
            position: absolute;
            width: 6px; height: 6px;
            background: #00c3ff;
            border-radius: 50%;
            top: 50%; left: 50%;
            margin-top: -3px; margin-left: -3px;
            display: none;
        }

        .welcome-rhombus-wrapper.processing .orbit-dot {
            display: block;
            animation: orcaOrbit 1.2s linear infinite;
        }

        @keyframes orcaOrbit {
            0% { transform: rotate(0deg) translateX(38px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(38px) rotate(-360deg); }
        }

        .welcome-text-1 {
            font-size: 18px;
            font-weight: 700;
        }

        .welcome-text-2 {
            font-size: 13px;
            color: #00c3ff;
        }

        /* ЧАТ-ЗОНА */
        .chat-scroller {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user { justify-content: flex-end; }
        .message-row.orca { justify-content: flex-start; }

        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .user .bubble {
            background: var(--user-bubble);
            color: #ffffff;
            border-radius: 14px 14px 4px 14px;
        }

        .orca .bubble {
            background: transparent;
            color: var(--orca-text);
        }

        /* ПОЛЕ ВВОДА КОМПАКТНОЕ */
        .input-area-container {
            padding: 10px;
            background: transparent;
        }

        .gradient-input-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--input-bg);
            border-radius: 14px;
            padding: 4px 6px 4px 12px;
            border: 1px solid var(--border-color);
        }

        #user-input-field {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
            padding: 8px 0;
        }

        /* ЕДИНАЯ СТАБИЛЬНАЯ КНОПКА */
        .action-btn {
            border: none;
            width: 36px; height: 36px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            transition: background 0.2s;
        }

        /* Стили когда кнопка активна на отправку текста */
        .action-btn.active-send {
            background: linear-gradient(135deg, #a020f0, #3b82f6);
            color: #ffffff;
        }

        /* АНИМАЦИЯ ДУМАЛКИ */
        .think-container { display: flex; align-items: center; padding: 5px 0; }
        .think-loader { width: 30px; height: 30px; position: relative; display: flex; align-items: center; justify-content: center; }
        .inner-diamond {
            width: 10px; height: 10px;
            background: conic-gradient(from 0deg, #3dff71, #2261ff, #ff4545, #3dff71);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
        .radar-arc { 
            width: 100%; height: 100%; border-radius: 50%; position: absolute;
            background: conic-gradient(from 0deg, #2261ff 90deg, transparent 90deg);
            -webkit-mask: radial-gradient(circle, transparent 70%, black 71%);
            mask: radial-gradient(circle, transparent 70%, black 71%);
            animation: radarRotate 0.8s linear infinite;
        }
        @keyframes radarRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="menuOverlay"></div>

    <div class="sidebar" id="sidebarMenu">
        <button class="new-chat-btn" id="btnNewChat">Новый чат</button>
        <div class="chat-list">
            <div class="chat-item">Текущий диалог Orca</div>
        </div>
    </div>

    <div class="main-content">
        
        <div class="header-bar">
            <button class="menu-toggle" id="btnMenuToggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            
            <button class="more-toggle" id="btnMoreToggle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="5" r="1.5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="12" cy="19" r="1.5"></circle>
                </svg>
            </button>

            <div class="options-menu" id="optionsMenu">
                <h4>OpenRouter API Ключ</h4>
                <input type="password" id="openRouterKeyField" placeholder="sk-or-...">
                
                <h4>Выбор Темы</h4>
                <div class="theme-selector">
                    <button class="theme-btn" id="themeBlackBtn">Черная</button>
                    <button class="theme-btn" id="themeBlueBtn">Синяя</button>
                    <button class="theme-btn" id="themeWhiteBtn">Белая</button>
                </div>
            </div>
        </div>

        <div class="welcome-container" id="welcomeScreen">
            <div class="welcome-rhombus-wrapper" id="logoWrapper">
                <div class="orbit-dot"></div>
                <svg class="welcome-rhombus" viewBox="0 0 500 500">
                    <defs>
                        <linearGradient id="rhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#a020f0" />
                            <stop offset="50%" stop-color="#3b82f6" />
                            <stop offset="100%" stop-color="#00c3ff" />
                        </linearGradient>
                    </defs>
                    <path d="M 250,5 C 310,180 320,190 495,250 C 320,310 310,320 250,495 C 190,320 180,310 5,250 C 180,190 190,180 250,5 Z" fill="url(#rhGrad)" />
                </svg>
                <div class="orca-emoji">🫍</div>
            </div>
            <h2 class="welcome-text-1">Привет, я OrcaAI.</h2>
            <p class="welcome-text-2">Нейросеть от Мишы!</p>
        </div>

        <div class="chat-scroller" id="dialogScroller"></div>

        <div class="input-area-container">
            <div class="gradient-input-box">
                <input type="text" id="user-input-field" placeholder="Спросить OrcaAI" autocomplete="off">
                
                <button class="action-btn" id="universalBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        const sidebarMenu = document.getElementById('sidebarMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const optionsMenu = document.getElementById('optionsMenu');
        const openRouterKeyField = document.getElementById('openRouterKeyField');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const logoWrapper = document.getElementById('logoWrapper');
        const dialogScroller = document.getElementById('dialogScroller');
        const userInputField = document.getElementById('user-input-field');
        const universalBtn = document.getElementById('universalBtn');

        // Загрузка сохраненных данных
        if(localStorage.getItem('or_api_key')) {
            openRouterKeyField.value = localStorage.getItem('or_api_key');
        }
        if(localStorage.getItem('app_theme')) {
            setTheme(localStorage.getItem('app_theme'));
        }

        openRouterKeyField.addEventListener('input', () => {
            localStorage.setItem('or_api_key', openRouterKeyField.value.trim());
        });

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
            optionsMenu.classList.remove('active');
        }

        // КЛИК НА ТРИ ТОЧКИ СВЕРХУ
        document.getElementById('btnMoreToggle').onclick = function(e) {
            e.stopPropagation();
            optionsMenu.classList.toggle('active');
        };

        // КЛИК НА БУРГЕР МЕНЮ
        document.getElementById('btnMenuToggle').onclick = function(e) {
            e.stopPropagation();
            sidebarMenu.classList.add('active');
            menuOverlay.classList.add('active');
        };

        menuOverlay.onclick = function() {
            sidebarMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
        };

        document.getElementById('btnNewChat').onclick = function() {
            dialogScroller.innerHTML = '';
            welcomeScreen.classList.remove('hidden');
            sidebarMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
        };

        // Закрытие выпадающего окна при тапе в любом другом месте
        document.onclick = function() {
            optionsMenu.classList.remove('active');
        };
        optionsMenu.onclick = function(e) {
            e.stopPropagation();
        };

        document.getElementById('themeBlackBtn').onclick = () => setTheme('black');
        document.getElementById('themeBlueBtn').onclick = () => setTheme('blue');
        document.getElementById('themeWhiteBtn').onclick = () => setTheme('white');

        // ЖЕСТКИЙ МОНИТОРИНГ ТЕКСТА (Подсветка кнопки)
        userInputField.oninput = function() {
            if (userInputField.value.trim().length > 0) {
                universalBtn.classList.add('active-send');
            } else {
                universalBtn.classList.remove('active-send');
            }
        };

        function forceScrollToBottom() {
            setTimeout(() => {
                dialogScroller.scrollTop = dialogScroller.scrollHeight;
            }, 50);
        }

        // ОТПРАВКА
        async function processUserMessage() {
            const text = userInputField.value.trim();
            if (!text) return; // Если текста нет, кнопка не реагирует

            if (!welcomeScreen.classList.contains('hidden')) {
                welcomeScreen.classList.add('hidden');
            }

            const userRow = document.createElement('div');
            userRow.className = 'message-row user';
            userRow.innerHTML = `<div class="bubble">${text}</div>`;
            dialogScroller.appendChild(userRow);

            userInputField.value = '';
            universalBtn.classList.remove('active-send');
            forceScrollToBottom();

            logoWrapper.classList.add('processing');

            const orcaRow = document.createElement('div');
            orcaRow.className = 'message-row orca';
            const orcaBubble = document.createElement('div');
            orcaBubble.className = 'bubble';
            orcaBubble.innerHTML = `
                <div class="think-container">
                    <div class="think-loader">
                        <div class="radar-arc"></div>
                        <div class="inner-diamond"></div>
                    </div>
                </div>
            `;
            orcaRow.appendChild(orcaBubble);
            dialogScroller.appendChild(orcaRow);
            forceScrollToBottom();

            const savedKey = localStorage.getItem('or_api_key') || "";

            try {
                if (!savedKey) {
                    orcaBubble.innerHTML = "Ошибка: Ключ OpenRouter не найден! Нажмите на 3 точки сверху справа и вставьте токен.";
                    return;
                }

                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${savedKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "google/gemini-2.5-flash", 
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0].message) {
                    orcaBubble.innerHTML = data.choices[0].message.content;
                } else {
                    orcaBubble.innerHTML = "Ошибка API OpenRouter. Проверьте токен или баланс.";
                }

            } catch (error) {
                orcaBubble.innerHTML = "<span style='color: #ff4545;'>Ошибка се
