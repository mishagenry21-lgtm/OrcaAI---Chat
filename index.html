<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaAI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b0b0b">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --text-color: #ffffff;
            --msg-user-bg: #2a2a2a;
            --input-bg: #1a1a1a;
        }
        [data-theme="white"] { --bg-color: #f5f5f5; --text-color: #000000; --msg-user-bg: #e0e0e0; --input-bg: #ffffff; }
        [data-theme="grey"] { --bg-color: #333333; --text-color: #f0f0f0; --msg-user-bg: #444444; --input-bg: #2a2a2a; }
        [data-theme="blue"] { --bg-color: #001f3f; --text-color: #ffffff; --msg-user-bg: #003366; --input-bg: #002b55; }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: 0.3s; }
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-btn { background: none; border: none; color: var(--text-color); font-size: 24px; cursor: pointer; }
        
        .dropdown { display: none; position: absolute; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: white; }
        .dropdown.active { display: block; }
        .dropdown button { display: block; width: 100%; padding: 10px; background: none; border: none; color: white; text-align: left; cursor: pointer; border-radius: 6px; }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 24px; padding-bottom: 100px; }
        .message { max-width: 85%; padding: 12px 18px; border-radius: 20px; font-size: 16px; line-height: 1.6; }
        .user-msg { align-self: flex-end; background: var(--msg-user-bg); border-bottom-right-radius: 4px; }
        .orca-msg { align-self: flex-start; display: flex; gap: 15px; }

        .orca-wrapper { position: relative; width: 32px; height: 32px; flex-shrink: 0; margin-top: 5px; }
        .rainbow-orbit { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(red, orange, yellow, green, blue, violet, red); filter: blur(6px); animation: rotate 3s linear infinite; }

        .input-area-container { position: fixed; bottom: 0; width: 100%; padding: 15px 0 25px; background: var(--bg-color); }
        .input-capsule { background: var(--input-bg); border-radius: 30px; display: flex; align-items: center; padding: 8px 12px; gap: 10px; border: 1px solid rgba(255,255,255,0.05); margin: 0 20px; }
        input[type="text"] { flex: 1; background: none; border: none; color: var(--text-color); padding: 10px; outline: none; font-size: 16px; }
        
        #send-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: #222; color: #555; cursor: pointer; transition: 0.3s; }
        #send-btn.active { background: #fff; color: #000; }

        .letter { opacity: 0; filter: blur(8px); animation: appear 0.6s forwards; display: inline-block; }
        @keyframes appear { to { opacity: 1; filter: blur(0); } }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .dot-typing { display: flex; gap: 4px; padding: 10px; }
        .dot { width: 5px; height: 5px; background: #555; border-radius: 50%; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div style="font-weight: 600; font-size: 19px;">OrcaAI 🐋</div>
        <button class="menu-btn" onclick="toggleMenu('top-menu')">⋮</button>
        <div id="top-menu" class="dropdown" style="top: 50px; right: 20px; width: 220px;">
            <button onclick="setTheme('dark')">⚫ Черная тема</button>
            <button onclick="setTheme('white')">⚪ Белая тема</button>
            <button onclick="setTheme('grey')">🔘 Серая тема</button>
            <button onclick="setTheme('blue')">🔵 Синяя тема</button>
            <hr style="opacity: 0.1">
            <div style="padding: 10px 5px;">
                <span style="font-size: 11px; opacity: 0.5;">OPENROUTER API KEY:</span>
                <input type="password" id="api-key-storage" placeholder="sk-or-..." 
                       style="width: 100%; background: #000; border: 1px solid #333; color: #fff; border-radius: 4px; margin-top: 5px;"
                       onchange="saveKey(this.value)">
            </div>
            <div style="padding: 10px; display: flex; justify-content: space-between; align-items: center;">
                <span>Думать</span>
                <input type="checkbox" id="think-mode">
            </div>
        </div>
    </header>

    <div id="chat-window"></div>

    <div class="input-area-container">
        <div class="input-capsule">
            <button onclick="toggleMenu('mode-menu')" style="background:none; border:none; color:#ffcc00; font-size:20px; cursor:pointer;">⚡</button>
            <div id="mode-menu" class="dropdown" style="bottom: 80px; left: 20px;">
                <button onclick="setMode('Fast')">🚀 Быстрый</button>
                <button onclick="setMode('Deep')">🧠 Думающий</button>
            </div>
            <input type="text" id="user-input" placeholder="Спросить OrcaAI" oninput="checkInput()" onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()" disabled>➔</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        let apiKey = localStorage.getItem('orca_key') || '';
        document.getElementById('api-key-storage').value = apiKey;
        let currentMode = 'Fast';
        let chatHistory = [{ role: "system", content: "Ты — OrcaAI. ПРАВИЛА: 1. Нет эмодзи. 2. Каждое предложение с новой строки. 3. Ты OrcaAI." }];

        function saveKey(v) { apiKey = v; localStorage.setItem('orca_key', v); alert('Ключ сохранен!'); }
        function toggleMenu(id) { document.getElementById(id).classList.toggle('active'); }
        function setTheme(t) { document.body.setAttribute('data-theme', t); toggleMenu('top-menu'); }
        function setMode(m) { currentMode = m; toggleMenu('mode-menu'); }

        function checkInput() {
            const input = document.getElementById('user-input');
            const btn = document.getElementById('send-btn');
            btn.classList.toggle('active', input.value.trim().length > 0);
            btn.disabled = input.value.trim().length === 0;
        }

        async function sendMessage() {
            if(!apiKey) { alert('Введи API Key в меню!'); toggleMenu('top-menu'); return; }
            const input = document.getElementById('user-input');
            const chatWindow = document.getElementById('chat-window');
            const text = input.value.trim();
            if (!text) return;

            chatWindow.innerHTML += `<div class="message user-msg">${text}</div>`;
            chatHistory.push({ role: "user", content: text });
            input.value = ''; checkInput();
            chatWindow.scrollTo(0, chatWindow.scrollHeight);

            const id = 'orca-' + Date.now();
            chatWindow.innerHTML += `<div class="orca-msg" id="${id}"><div class="orca-wrapper"><div class="rainbow-orbit"></div></div><div class="orca-content"><div class="think-box" style="color:grey; font-size:12px; display:none;"></div><div class="dot-typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="text-area"></div></div></div>`;
            
            const area = document.getElementById(id).querySelector('.text-area');
            const dots = document.getElementById(id).querySelector('.dot-typing');
            const think = document.getElementById(id).querySelector('.think-box');

            if(document.getElementById('think-mode').checked) {
                think.style.display = 'block'; think.innerText = 'Анализ...';
                await new Promise(r => setTimeout(r, 1500));
                think.innerText = 'Думаю...';
                await new Promise(r => setTimeout(r, 1500));
                think.style.display = 'none';
            }

            const model = currentMode === 'Fast' ? 'google/gemini-2.0-flash-lite-001' : 'deepseek/deepseek-r1';
            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ "model": model, "messages": chatHistory })
                });
                const data = await res.json();
                let aiText = data.choices[0].message.content;
                aiText = aiText.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}]/gu, '');
                aiText = aiText.replace(/([.!?])\s+(?=[А-ЯA-Z])/g, "$1\n\n");
                
                dots.style.display = 'none';
                chatHistory.push({ role: "assistant", content: aiText });
                typeOrca(aiText, area);
            } catch (e) { dots.style.display = 'none'; area.innerText = "Ошибка. Проверь ключ."; }
        }

        function typeOrca(text, element) {
            const words = text.split(' ');
            let i = 0;
            function type() {
                if (i < words.length) {
                    let l = 0; const word = words[i];
                    function tWord() {
                        if (l < word.length) {
                            const s = document.createElement('span'); s.className = 'letter';
                            if(word[l] === "\n") element.appendChild(document.createElement('br'));
                            else { s.innerText = word[l]; element.appendChild(s); }
                            l++; setTimeout(tWord, 40);
                        } else { element.appendChild(document.createTextNode(' ')); i++; setTimeout(type, 50); }
                        document.getElementById('chat-window').scrollTo(0, document.getElementById('chat-window').scrollHeight);
                    }
                    tWord();
                }
            }
            type();
        }

        window.onclick = e => { if (!e.target.matches('.menu-btn')) document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active')); }
    </script>
</body>
</html>
