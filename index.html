<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaAI Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --text-color: #ffffff;
            --panel-bg: #1a1a1a;
            --icon-bg: #2a2a2a;
            --accent: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Эффект стекла для хедера */
        header { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 110;
            background: rgba(11, 11, 11, 0.7);
        }
        
        .logo { font-weight: bold; font-size: 18px; letter-spacing: 1px; }
        .menu-trigger { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px; }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 160px; }
        .message { max-width: 85%; line-height: 1.5; font-size: 16px; position: relative; }
        
        /* Анимация проявления */
        .blur-in { animation: blurFade 0.6s ease-out forwards; filter: blur(10px); opacity: 0; }
        @keyframes blurFade { to { filter: blur(0); opacity: 1; } }

        .user-msg { align-self: flex-end; background: #222; padding: 12px 16px; border-radius: 18px 18px 4px 18px; }
        .orca-msg { align-self: flex-start; display: flex; gap: 12px; width: 100%; }
        
        /* Улучшенная орбита с пульсацией */
        .avatar { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(red, blue, green, red); filter: blur(4px); animation: rot 4s linear infinite; flex-shrink: 0; }
        .loading .avatar { animation: rot 2s linear infinite, pulse 1.5s ease-in-out infinite; }
        
        @keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } }

        /* Стиль блоков кода и кнопка копирования */
        pre { background: #000; padding: 15px; border-radius: 12px; overflow-x: auto; position: relative; border: 1px solid #333; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #333; color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-size: 10px; cursor: pointer; opacity: 0.6; }
        .copy-btn:active { background: #555; }

        .input-panel { position: fixed; bottom: 0; width: 100%; background: var(--panel-bg); border-radius: 24px 24px 0 0; padding: 15px 15px 25px; display: flex; flex-direction: column; gap: 15px; z-index: 100; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        #user-input { width: 100%; background: none; border: none; color: white; font-size: 18px; padding: 5px; }
        #user-input::placeholder { color: #666; }

        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .group { display: flex; gap: 10px; align-items: center; }

        .btn-circle { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--icon-bg); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-circle:active { transform: scale(0.9); background: #333; }
        
        .btn-mode { border-radius: 21px; padding: 0 12px; height: 42px; display: flex; align-items: center; gap: 5px; background: var(--icon-bg); border: none; color: white; cursor: pointer; }
        
        .action-btn { height: 42px; border-radius: 21px; border: none; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: 0.2s; cursor: pointer; }
        .voice-style { background: white; color: black; padding: 0 18px; gap: 8px; }
        .send-style { background: #2a2a2a; color: white; width: 42px; }
        .action-btn:active { transform: scale(0.95); }

        .pop-menu { display: none; position: absolute; background: #1a1a1a; border: 1px solid #333; border-radius: 15px; padding: 8px; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 200px; }
        .pop-menu.active { display: block; animation: blurFade 0.3s ease; }
        .pop-item { width: 100%; padding: 12px; background: none; border: none; color: white; text-align: left; border-radius: 8px; cursor: pointer; }
        .pop-item:hover { background: #252525; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 105; }
        .icon-svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeMenus()"></div>

<header>
    <div class="logo">OrcaAI</div>
    <button class="menu-trigger" onclick="vibrate(); openMenu('settings-menu', event)">⋮</button>
    <div id="settings-menu" class="pop-menu" style="top: 55px; right: 20px;">
        <div style="padding: 10px;">
            <span style="font-size: 10px; opacity: 0.5;">API KEY:</span>
            <input type="password" id="key-in" style="width:100%; background:#000; border:1px solid #444; color:white; margin-top:5px; padding:5px;" onchange="saveKey(this.value)">
        </div>
        <button class="pop-item" onclick="clearChat()" style="color:red;">Очистить чат</button>
    </div>
</header>

<div id="chat-window"></div>

<div class="input-panel">
    <input type="text" id="user-input" placeholder="Задайте любой вопрос" oninput="updateUI()" onkeypress="if(event.key==='Enter') send()">
    
    <div class="controls-row">
        <div class="group">
            <button class="btn-circle" onclick="vibrate()">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z"/></svg>
            </button>
            
            <button class="btn-mode" onclick="vibrate(); openMenu('mode-menu', event)">
                <svg class="icon-svg" viewBox="0 0 24 24" style="width:16px;"><path d="M7,2V13H10V22L17,10H13L17,2H7Z"/></svg>
                <span id="mode-label" style="font-size:14px; font-weight:500;">∨</span>
            </button>
            <div id="mode-menu" class="pop-menu" style="bottom: 80px; left: 15px;">
                <button class="pop-item" onclick="setM('Fast')">Быстрый ответы</button>
                <button class="pop-item" onclick="setM('Deep')">Думающий (DeepSeek)</button>
            </div>
        </div>

        <div class="group">
            <button class="btn-circle" onclick="vibrate()">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z"/></svg>
            </button>
            
            <div id="action-area">
                <button class="action-btn voice-style" onclick="vibrate(); startV()">
                    <svg viewBox="0 0 24 24" style="width:18px; fill:black;"><path d="M10,20H14V4H10V20M4,20H8V12H4V20M16,20H20V12H16V20Z"/></svg>
                    Голосовой режим
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let key = localStorage.getItem('orca_key') || '';
    let mode = 'Fast';
    let history = JSON.parse(localStorage.getItem('orca_hist')) || [];

    window.onload = () => { 
        document.getElementById('key-in').value = key;
        render();
    };

    function vibrate() { if(navigator.vibrate) navigator.vibrate(10); }

    function openMenu(id, e) {
        e.stopPropagation();
        closeMenus();
        document.getElementById(id).classList.add('active');
        document.getElementById('overlay').style.display = 'block';
    }

    function closeMenus() {
        document.querySelectorAll('.pop-menu').forEach(m => m.classList.remove('active'));
        document.getElementById('overlay').style.display = 'none';
    }

    function setM(m) { mode = m; closeMenus(); vibrate(); }
    function saveKey(v) { key = v.trim(); localStorage.setItem('orca_key', key); }

    function updateUI() {
        const input = document.getElementById('user-input').value.trim();
        const area = document.getElementById('action-area');
        if(input.length > 0) {
            area.innerHTML = `<button class="action-btn send-style" onclick="send()">➔</button>`;
        } else {
            area.innerHTML = `<button class="action-btn voice-style" onclick="vibrate(); startV()">
                <svg viewBox="0 0 24 24" style="width:18px; fill:black;"><path d="M10,20H14V4H10V20M4,20H8V12H4V20M16,20H20V12H16V20Z"/></svg>
                Голосовой режим</button>`;
        }
    }

    function render() {
        const win = document.getElementById('chat-window');
        win.innerHTML = '';
        history.forEach(m => {
            if(m.role === 'user') {
                win.innerHTML += `<div class="message user-msg">${m.content}</div>`;
            } else {
                addAiMsg(m.content, false);
            }
        });
        win.scrollTo(0, win.scrollHeight);
    }

    function addAiMsg(content, animate) {
        const win = document.getElementById('chat-window');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'orca-msg';
        const html = marked.parse(content);
        msgDiv.innerHTML = `<div class="avatar"></div><div class="message ${animate ? 'blur-in' : ''}">${html}</div>`;
        win.appendChild(msgDiv);
        
        // Кнопки копирования для кода
        msgDiv.querySelectorAll('pre').forEach(pre => {
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.innerText = 'COPY';
            btn.onclick = () => {
                navigator.clipboard.writeText(pre.innerText.replace('COPY', ''));
                btn.innerText = 'DONE!';
                vibrate();
                setTimeout(() => btn.innerText = 'COPY', 2000);
            };
            pre.appendChild(btn);
        });
    }

    function clearChat() { history = []; localStorage.removeItem('orca_hist'); render(); closeMenus(); vibrate(); }

    async function send() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if(!text || !key) return;

        vibrate();
        history.push({role:'user', content:text});
        input.value = ''; 
        updateUI();
        render();

        const win = document.getElementById('chat-window');
        const tempId = 'loading-' + Date.now();

        win.innerHTML += `
            <div class="orca-msg loading" id="${tempId}">
                <div class="avatar"></div>
                <div class="message" style="opacity: 0.5;">...</div>
            </div>`;
        win.scrollTo(0, win.scrollHeight);

        const model = mode === 'Fast' ? 'google/gemini-2.0-flash-lite-001' : 'deepseek/deepseek-r1';
        
        try {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                body: JSON.stringify({ "model": model, "messages": history })
            });
            
            const data = await res.json();
            let aiText = data.choices[0].message.content.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}]/gu, '');
            
            if (aiText.toLowerCase().includes('google') || aiText.toLowerCase().includes('языковая модель')) {
                aiText = "Я OrcaAI, твой персональный помощник.";
            }

            document.getElementById(tempId).remove();
            addAiMsg(aiText, true);
            vibrate();

            history.push({role:'assistant', content:aiText});
            localStorage.setItem('orca_hist', JSON.stringify(history));
            win.scrollTo(0, win.scrollHeight);
            
        } catch (e) { 
            if(document.getElementById(tempId)) document.getElementById(tempId).remove();
            alert('Ошибка API'); 
        }
    }

    function startV() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return;
        const rec = new Rec();
        rec.onresult = (e) => { 
            document.getElementById('user-input').value = e.results[0][0].transcript; 
            updateUI(); 
            send(); 
        };
        rec.start();
    }
</script>

</body>
</html>
