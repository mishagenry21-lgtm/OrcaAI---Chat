<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrcaAI Elite</title>
    <link rel="manifest" href="manifest.json?v=3">
    <meta name="theme-color" content="#00c3ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-main: #0b0b0d;
            --bg-sidebar: #111115;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.5);
            --border-color: rgba(255, 255, 255, 0.05);
            --input-bg: #121216;
            --user-bubble: #1c1c24;
            --user-bubble-border: rgba(255, 255, 255, 0.04);
            --orca-text: #e2e2e9;
            --menu-bg: #181820;
        }

        [data-theme="blue"] {
            --bg-main: #0a1128;
            --bg-sidebar: #001f54;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --border-color: rgba(0, 119, 182, 0.2);
            --input-bg: #003566;
            --user-bubble: #000814;
            --user-bubble-border: rgba(0, 180, 216, 0.3);
            --orca-text: #e0f2fe;
            --menu-bg: #001d3d;
        }

        [data-theme="white"] {
            --bg-main: #f8f9fa;
            --bg-sidebar: #e9ecef;
            --text-main: #212529;
            --text-sub: rgba(33, 37, 41, 0.6);
            --border-color: rgba(0, 0, 0, 0.1);
            --input-bg: #ffffff;
            --user-bubble: #dee2e6;
            --user-bubble-border: rgba(0, 0, 0, 0.05);
            --orca-text: #212529;
            --menu-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* САЙДБАР */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: fixed;
            top: 0; bottom: 0; left: -265px;
            z-index: 99999;
            transition: left 0.2s ease-out;
        }

        .sidebar.active {
            left: 0;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #a020f0, #00c3ff);
            border: 1px solid rgba(0, 195, 255, 0.4);
            color: #ffffff;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 13px;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 99998;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            height: 100%;
            width: 100%;
        }

        .header-bar {
            height: 48px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .menu-toggle, .more-toggle {
            background: none;
            border: none;
            color: var(--text-main);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 150;
        }

        /* ГАРАНТИРОВАННОЕ МЕНЮ ТРЕХ ТОЧЕК СВЕРХУ ВСЕГО */
        .options-menu {
            position: absolute;
            top: 52px; right: 10px;
            background: var(--menu-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            width: 240px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 200000;
        }

        .options-menu.active {
            display: flex !important;
        }

        .options-menu h4 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-sub);
        }

        .options-menu input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .theme-selector {
            display: flex;
            gap: 6px;
        }

        .theme-btn {
            flex: 1;
            padding: 6px 2px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            font-size: 11px;
        }

        /* СТАРТОВЫЙ ЭКРАН */
        .welcome-container {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 85%;
            z-index: 2;
        }

        .welcome-container.hidden {
            display: none !important;
        }

        .welcome-rhombus-wrapper {
            position: relative;
            width: 100px; height: 100px;
            margin-bottom: 12px;
        }

        .welcome-rhombus {
            width: 100%; height: 100%;
        }

        .orca-emoji {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            user-select: none;
        }

        /* ОРБИТА */
        .orbit-dot {
            position: absolute;
            width: 6px; height: 6px;
            background: #00c3ff;
            border-radius: 50%;
            top: 50%; left: 50%;
            margin-top: -3px; margin-left: -3px;
            box-shadow: 0 0 8px #00c3ff;
            display: none;
        }

        .welcome-rhombus-wrapper.processing .orbit-dot {
            display: block;
            animation: orcaOrbit 1.2s linear infinite;
        }

        @keyframes orcaOrbit {
            0% { transform: rotate(0deg) translateX(44px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(44px) rotate(-360deg); }
        }

        .welcome-text-1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .welcome-text-2 {
            font-size: 14px;
            color: #00c3ff;
            font-weight: 600;
        }

        /* ЧАТ-ЗОНА */
        .chat-scroller {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user { justify-content: flex-end; }
        .message-row.orca { justify-content: flex-start; }

        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .user .bubble {
            background: var(--user-bubble);
            color: #ffffff;
            border-radius: 16px 16px 4px 16px;
            border: 1px solid var(--user-bubble-border);
        }

        .orca .bubble {
            background: transparent;
            color: var(--orca-text);
            border-radius: 0;
            padding: 0;
            max-width: 100%;
        }

        /* ПОЛЕ ВВОДА КОМПАКТНОЕ */
        .input-area-container {
            padding: 8px 12px 12px 12px;
            background: transparent;
        }

        .gradient-input-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--input-bg);
            border-radius: 18px;
            padding: 4px 6px 4px 12px;
            position: relative;
            z-index: 10;
        }

        .gradient-input-box::before {
            content: '';
            position: absolute;
            top: -1.5px; left: -1.5px; right: -1.5px; bottom: -1.5px;
            border-radius: 18px;
            padding: 1.5px;
            background: linear-gradient(90deg, #a020f0, #3b82f6, #00c3ff, #a020f0);
            background-size: 300% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: neonFlow 4s linear infinite;
        }

        @keyframes neonFlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        #user-input-field {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
            padding: 8px 0;
            font-family: inherit;
        }

        #user-input-field::placeholder {
            color: var(--text-sub);
        }

        /* МОБИЛЬНАЯ УМНАЯ КНОПКА */
        .action-btn {
            border: none;
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            z-index: 500;
        }

        /* Класс принудительного включения режима отправки */
        .action-btn.send-mode {
            background: linear-gradient(135deg, #a020f0, #3b82f6) !important;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            color: #ffffff !important;
        }

        .action-btn #icon-send { display: none; }
        .action-btn #icon-voice { display: block; }

        .action-btn.send-mode #icon-send { display: block !important; }
        .action-btn.send-mode #icon-voice { display: none !important; }

        /* ЛОАДЕР */
        .think-container { display: flex; align-items: center; padding: 5px 0; }
        .think-loader { width: 34px; height: 34px; position: relative; display: flex; align-items: center; justify-content: center; }
        .inner-diamond {
            width: 12px; height: 12px;
            background: conic-gradient(from 0deg, #3dff71, #2261ff, #ff4545, #3dff71);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }
        .radar-arc { 
            width: 100%; height: 100%; border-radius: 50%; position: absolute;
            background: conic-gradient(from 0deg, #2261ff 90deg, transparent 90deg);
            -webkit-mask: radial-gradient(circle, transparent 70%, black 71%);
            mask: radial-gradient(circle, transparent 70%, black 71%);
            animation: radarRotate 0.8s linear infinite;
        }
        @keyframes radarRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="menuOverlay"></div>

    <div class="sidebar" id="sidebarMenu">
        <button class="new-chat-btn" id="btnNewChat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Новый чат
        </button>
        <div class="chat-list">
            <div class="chat-item" style="border-left: 3px solid #00c3ff;">Текущий диалог Orca</div>
        </div>
    </div>

    <div class="main-content">
        
        <div class="header-bar">
            <button class="menu-toggle" id="btnMenuToggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            
            <button class="more-toggle" id="btnMoreToggle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="5" r="1.5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="12" cy="19" r="1.5"></circle>
                </svg>
            </button>

            <div class="options-menu" id="optionsMenu">
                <h4>OpenRouter API Ключ</h4>
                <input type="password" id="openRouterKeyField" placeholder="sk-or-...">
                
                <h4>Выбор Темы</h4>
                <div class="theme-selector">
                    <button class="theme-btn" id="themeBlackBtn">Черная</button>
                    <button class="theme-btn" id="themeBlueBtn">Синяя</button>
                    <button class="theme-btn" id="themeWhiteBtn">Белая</button>
                </div>
            </div>
        </div>

        <div class="welcome-container" id="welcomeScreen">
            <div class="welcome-rhombus-wrapper" id="logoWrapper">
                <div class="orbit-dot"></div>
                <svg class="welcome-rhombus" viewBox="0 0 500 500">
                    <defs>
                        <linearGradient id="rhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#a020f0" />
                            <stop offset="50%" stop-color="#3b82f6" />
                            <stop offset="100%" stop-color="#00c3ff" />
                        </linearGradient>
                    </defs>
                    <path d="M 250,5 C 310,180 320,190 495,250 C 320,310 310,320 250,495 C 190,320 180,310 5,250 C 180,190 190,180 250,5 Z" fill="url(#rhGrad)" />
                </svg>
                <div class="orca-emoji">🫍</div>
            </div>
            <h2 class="welcome-text-1">Привет, я OrcaAI.</h2>
            <p class="welcome-text-2">Нейросеть от Мишы!</p>
        </div>

        <div class="chat-scroller" id="dialogScroller"></div>

        <div class="input-area-container">
            <div class="gradient-input-box">
                <input type="text" id="user-input-field" placeholder="Спросить OrcaAI" autocomplete="off">
                <button class="action-btn" id="dynamicActionBtn">
                    <svg id="icon-voice" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                    </svg>
                    <svg id="icon-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        const sidebarMenu = document.getElementById('sidebarMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const optionsMenu = document.getElementById('optionsMenu');
        const openRouterKeyField = document.getElementById('openRouterKeyField');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const logoWrapper = document.getElementById('logoWrapper');
        const dialogScroller = document.getElementById('dialogScroller');
        const userInputField = document.getElementById('user-input-field');
        const dynamicActionBtn = document.getElementById('dynamicActionBtn');

        // ЗАГРУЗКА ДАННЫХ ИЗ localStorage
        if(localStorage.getItem('or_api_key')) {
            openRouterKeyField.value = localStorage.getItem('or_api_key');
        }
        if(localStorage.getItem('app_theme')) {
            setTheme(localStorage.getItem('app_theme'));
        }

        openRouterKeyField.addEventListener('input', () => {
            localStorage.setItem('or_api_key', openRouterKeyField.value.trim());
        });

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
            optionsMenu.classList.remove('active');
        }

        // ЖЕСТКИЕ СЛУШАТЕЛИ ДЛЯ ТАЧ-ЭКРАНОВ СМАРТФОНОВ (FIX КЛИКОВ)
        const touchEvent = 'touchstart';

        document.getElementById('btnMenuToggle').addEventListener(touchEvent, (e) => {
            e.preventDefault(); e.stopPropagation();
            sidebarMenu.classList.add('active');
            menuOverlay.classList.add('active');
        }, { passive: false });

        menuOverlay.addEventListener(touchEvent, (e) => {
            e.preventDefault();
            sidebarMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
        }, { passive: false });

        document.getElementById('btnNewChat').addEventListener(touchEvent, (e) => {
            e.preventDefault();
            dialogScroller.innerHTML = '';
            welcomeScreen.classList.remove('hidden');
            sidebarMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
        }, { passive: false });

        // Открытие трех точек по тачу
        document.getElementById('btnMoreToggle').addEventListener(touchEvent, (e) => {
            e.preventDefault(); e.stopPropagation();
            optionsMenu.classList.toggle('active');
        }, { passive: false });

        // Закрытие меню при клике по экрану чата
        dialogScroller.addEventListener(touchEvent, () => {
            optionsMenu.classList.remove('active');
        });

        // Переключение тем через тач
        document.getElementById('themeBlackBtn').addEventListener(touchEvent, (e) => { e.preventDefault(); setTheme('black'); });
        document.getElementById('themeBlueBtn').addEventListener(touchEvent, (e) => { e.preventDefault(); setTheme('blue'); });
        document.getElementById('themeWhiteBtn').addEventListener(touchEvent, (e) => { e.preventDefault(); setTheme('white'); });

        // ЖЕЛЕЗНЫЙ МОНИТОРИНГ К
